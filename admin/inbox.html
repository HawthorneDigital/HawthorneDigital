<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Email Centre | Hawthorne Digital</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}body{margin:0;background:#f7f9fc;color:#202B4C;font:14px 'DM Sans',sans-serif}main{padding:28px}header,.toolbar,.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}header{justify-content:space-between}h1{margin:0}p{color:#64748b}button,a.btn,input{font:inherit;border:1px solid #e6eaf1;border-radius:8px;padding:10px 14px;background:white;color:inherit}button,a.btn{cursor:pointer;font-weight:600;text-decoration:none}button:disabled{opacity:.5;cursor:default}.primary,a.primary{background:#2856B1;color:white}.toolbar{margin:20px 0}input{flex:1;min-width:130px}.panel{background:white;border:1px solid #e6eaf1;border-radius:12px;overflow:hidden}.status,.item{padding:15px;border-bottom:1px solid #e6eaf1}.item{display:flex;gap:10px;align-items:center}.open{flex:1;text-align:left;border:0;background:transparent;min-width:0;overflow-wrap:anywhere}.unread{background:#eef3fc}.unread .open{font-weight:700}.date{display:block;color:#64748b;font-size:12px;font-weight:400}.danger{color:#b42318}dialog{border:1px solid #e6eaf1;border-radius:12px;width:min(850px,94vw);max-height:85vh;color:inherit;padding:24px}dialog::backdrop{background:#202b4c66}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;line-height:1.65}#detailMeta{white-space:pre-wrap;overflow-wrap:anywhere}h2{overflow-wrap:anywhere}@media(max-width:600px){main{padding:14px}}
</style></head><body><main><header><h1>Email Centre</h1><a class="btn primary" href="/admin/email.html">+ New Email</a></header><p>hello@hawthornedigital.co.uk</p><div class="toolbar"><button id="inbox" class="primary">Inbox</button><button id="trash">Deleted</button><input id="search" placeholder="Search loaded emails" aria-label="Search loaded emails"><button id="refresh">Refresh</button></div><section class="panel"><div id="status" class="status" role="status">Connecting…</div><div id="messages"></div></section><div class="toolbar"><button id="prev">Previous</button><button id="next">Next</button></div></main><dialog id="viewer"><div class="actions"><button id="close">Close</button><button id="move" class="danger">Delete</button></div><h2 id="subject"></h2><p id="detailMeta"></p><pre id="bodyText"></pre><p id="attachments"></p></dialog><script>
const db=supabase.createClient('https://pmtwrbgjzcxtjdjygxps.supabase.co','sb_publishable_lyGr71TWY7VpI73wPeJdMg_U6knl2s_');const $=id=>document.getElementById(id);let folder='inbox',page=1,emails=[],total=0,validity='',canDelete=false,busy=false,selected=null;
async function api(q,post=false){const {data,error}=await db.auth.getSession();if(error||!data.session)throw Error('Please sign in to the administration portal first.');const headers={Authorization:'Bearer '+data.session.access_token};if(post)headers['Content-Type']='application/json';const r=await fetch('/api/inbox'+(post?'':'?'+new URLSearchParams(q)),{method:post?'POST':'GET',headers,body:post?JSON.stringify(q):undefined,cache:'no-store'});const j=await r.json();if(!r.ok||!j.success)throw Error(j.error||'Request failed');return j;}
function sender(m){return (m.from||[]).map(x=>x.name||x.address).join(', ')||'Unknown sender'}
function render(){const q=$('search').value.toLowerCase();$('messages').replaceChildren();for(const m of emails.filter(m=>(sender(m)+' '+m.subject).toLowerCase().includes(q))){const row=document.createElement('div');row.className='item '+(m.read?'':'unread');const b=document.createElement('button');b.className='open';b.textContent=sender(m)+' · '+m.subject;const d=document.createElement('span');d.className='date';d.textContent=m.date?new Date(m.date).toLocaleString('en-GB'):'';b.append(d);b.onclick=()=>open(m);row.append(b);if(canDelete){const a=document.createElement('button');a.className='danger';a.textContent=folder==='trash'?'Restore':'Delete';a.onclick=()=>move(m);row.append(a)}$('messages').append(row)}$('prev').disabled=busy||page===1;$('next').disabled=busy||page*20>=total;}
async function load(){if(busy)return;busy=true;emails=[];total=0;render();$('status').textContent='Connecting to mailbox…';try{const j=await api({action:'list',folder,page});emails=j.emails;total=j.total;validity=j.uidValidity;canDelete=j.canDelete;$('status').textContent=`${total} messages · Page ${page}`;}catch(e){$('status').textContent=e.message;}finally{busy=false;render()}}
async function open(m){if(busy)return;busy=true;selected={uid:m.uid,uidValidity:validity,folder};$('subject').textContent=m.subject;$('detailMeta').textContent='';$('bodyText').textContent='Loading message…';$('attachments').textContent='';$('move').hidden=true;$('viewer').showModal();try{const j=await api({...selected,action:'read'});$('subject').textContent=j.subject;$('detailMeta').textContent='From: '+j.from+'\nTo: '+j.to+'\n'+(j.date?new Date(j.date).toLocaleString('en-GB'):'');$('bodyText').textContent=j.text;$('attachments').textContent=j.attachments.length?'Attachments (names only): '+j.attachments.map(a=>a.name).join(', '):'';$('move').textContent=folder==='trash'?'Restore':'Delete';$('move').hidden=!canDelete;}catch(e){$('bodyText').textContent=e.message}finally{busy=false}}
async function move(m){if(busy||!canDelete)return;const action=folder==='trash'?'restore':'delete';if(!confirm(action==='delete'?'Move this email to Deleted?':'Restore this email to Inbox?'))return;busy=true;try{await api({action,folder,uid:m.uid,uidValidity:m.uidValidity||validity},true);if($('viewer').open)$('viewer').close();}catch(e){alert(e.message)}finally{busy=false;load()}}
function switchFolder(f){if(busy)return;folder=f;page=1;$('inbox').className=f==='inbox'?'primary':'';$('trash').className=f==='trash'?'primary':'';load()}
$('inbox').onclick=()=>switchFolder('inbox');$('trash').onclick=()=>switchFolder('trash');$('refresh').onclick=load;$('search').oninput=render;$('prev').onclick=()=>{if(!busy&&page>1){page--;load()}};$('next').onclick=()=>{if(!busy&&page*20<total){page++;load()}};$('close').onclick=()=>$('viewer').close();$('move').onclick=()=>selected&&move(selected);load();
</script></body></html>
