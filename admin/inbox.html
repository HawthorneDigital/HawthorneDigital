<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inbox Centre | Hawthorne Digital</title><link rel="icon" href="/favicon.png"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}body{margin:0;background:#f7f9fc;color:#202B4C;font:14px 'DM Sans',sans-serif}main{padding:32px;max-width:1600px;margin:auto}h1{font-size:30px;margin:0 0 6px}p{color:#64748b;margin:0 0 24px}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}input,select,button{font:inherit;padding:12px 16px;border:1px solid #e6eaf1;border-radius:9px;background:white;color:inherit}input{flex:1;min-width:180px}button{background:#2856B1;color:white;cursor:pointer;font-weight:600}button:disabled{opacity:.5;cursor:wait}.panel{background:white;border:1px solid #e6eaf1;border-radius:12px;overflow:hidden}.status{padding:18px;border-bottom:1px solid #e6eaf1;color:#64748b}.email{display:grid;grid-template-columns:12px minmax(130px,1fr) minmax(150px,2fr) 160px;gap:14px;padding:18px;align-items:center;border-bottom:1px solid #e6eaf1}.email:last-child{border:0}.email.unread{background:#eef3fc;font-weight:700}.dot{width:8px;height:8px;border-radius:50%;background:#2856B1}.read .dot{background:transparent}.date{color:#64748b;font-size:12px;text-align:right}.error{color:#b42318}@media(max-width:650px){main{padding:16px}.email{grid-template-columns:10px 1fr;gap:8px}.subject,.date{grid-column:2;text-align:left}}
</style></head><body><main><h1>Inbox Centre</h1><p>Manage incoming Hawthorne Digital correspondence.</p><div class="toolbar"><select aria-label="Mailbox"><option>hello@hawthornedigital.co.uk</option></select><input id="search" type="search" placeholder="Search loaded emails" aria-label="Search loaded emails"><button id="refresh">Refresh inbox</button></div><section class="panel"><div id="status" class="status" role="status" aria-live="polite">Verifying your session…</div><div id="messages"></div></section></main><script>
const db=supabase.createClient('https://pmtwrbgjzcxtjdjygxps.supabase.co','sb_publishable_lyGr71TWY7VpI73wPeJdMg_U6knl2s_');
const statusEl=document.getElementById('status'), messages=document.getElementById('messages'), search=document.getElementById('search'), refresh=document.getElementById('refresh');let emails=[],total=0,ready=false;
function sender(m){return (m.from||[]).map(x=>[x.name,x.address].filter(Boolean).join(' · ')).join(', ')||'Unknown sender'}
function render(){messages.replaceChildren();if(!ready)return;const q=search.value.toLowerCase().trim();const filtered=emails.filter(m=>(sender(m)+' '+m.subject).toLowerCase().includes(q));statusEl.className='status';statusEl.textContent=`${filtered.length} of ${emails.length} loaded emails · ${total} in inbox`;for(const m of filtered){const row=document.createElement('div');row.className='email '+(m.read?'read':'unread');const dot=document.createElement('span');dot.className='dot';dot.setAttribute('aria-label',m.read?'Read':'Unread');row.append(dot);for(const [value,cls] of [[sender(m),'sender'],[m.subject,'subject'],[m.date?new Date(m.date).toLocaleString('en-GB'):'','date']]){const el=document.createElement('span');el.className=cls;el.textContent=value;row.append(el)}messages.append(row)}if(!filtered.length){const el=document.createElement('div');el.className='status';el.textContent='No emails to display.';messages.append(el)}}
async function load(){refresh.disabled=true;ready=false;emails=[];messages.replaceChildren();statusEl.className='status';statusEl.textContent='Connecting to mailbox…';try{const {data,error}=await db.auth.getSession();if(error||!data.session)throw new Error('Please sign in to the administration portal first.');const response=await fetch('/api/inbox',{headers:{Authorization:'Bearer '+data.session.access_token},cache:'no-store'});const result=await response.json();if(!response.ok||!result.success)throw new Error(result.error||'Inbox request failed');emails=Array.isArray(result.emails)?result.emails:[];total=result.total;ready=true;render()}catch(e){statusEl.className='status error';statusEl.textContent=e.message||'Unable to load inbox.'}finally{refresh.disabled=false}}
search.addEventListener('input',render);refresh.addEventListener('click',load);load();
</script></body></html>
