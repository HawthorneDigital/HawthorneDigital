
<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<meta name="description" content="Ideas, guidance and insights from Hawthorne Digital.">
<meta name="theme-color" content="#202B4C">

<title>Insights & Articles | Hawthorne Digital</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Shared Hawthorne Digital navigation and footer -->
<script src="/shared/header.js" defer></script>

<!-- Blog libraries -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>

<style>
:root {
    --navy: #202B4C;
    --blue: #2856B1;
    --light: #EEF3FC;
    --muted: #68738A;
    --border: #E7EBF2;
}

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    font-family: 'DM Sans', sans-serif;
    color: var(--navy);
    background: #fff;
}

/* HERO */

.hero {
    padding: 100px 22px 85px;
    color: #fff;
    background:
        radial-gradient(circle at 85% 15%, #4779c955, transparent 30%),
        linear-gradient(125deg, #202B4C, #2856B1);
}

.inner {
    width: min(1160px, calc(100% - 40px));
    margin: auto;
}

.eyebrow {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 2.5px;
    color: #c5d6ff;
    text-transform: uppercase;
    margin-bottom: 18px;
}

.hero h1 {
    font-size: clamp(42px, 6vw, 68px);
    letter-spacing: -3px;
    line-height: 1.04;
    max-width: 760px;
    margin: 0 0 20px;
}

.hero p {
    max-width: 640px;
    color: #ffffffc9;
    line-height: 1.8;
    font-size: 17px;
    margin: 0;
}

/* MAIN CONTENT */

main {
    padding: 65px 0 100px;
}

.toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
    margin-bottom: 25px;
}

h2 {
    font-size: 25px;
    letter-spacing: -.7px;
    margin: 0;
}

.search {
    width: min(340px, 100%);
    padding: 13px 15px;
    border: 1px solid var(--border);
    font: inherit;
    outline: none;
    border-radius: 0;
}

.search:focus {
    border-color: var(--blue);
}

/* CATEGORIES */

.categories {
    display: flex;
    gap: 9px;
    flex-wrap: wrap;
    margin-bottom: 36px;
}

.cat {
    padding: 9px 15px;
    border: 1px solid var(--border);
    background: white;
    color: var(--muted);
    font-weight: 700;
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
    transition: .2s;
}

.cat.active,
.cat:hover {
    background: var(--navy);
    border-color: var(--navy);
    color: #fff;
}

/* FEATURED ARTICLE */

.featured-label {
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--blue);
    font-weight: 800;
    margin-bottom: 15px;
}

.featured {
    display: grid;
    grid-template-columns: 1fr 1fr;
    background: #f3f6fc;
    margin-bottom: 52px;
    color: inherit;
    text-decoration: none;
    min-height: 320px;
    transition: .2s;
}

.featured:hover {
    box-shadow: 0 16px 38px #202b4c12;
}

.feature-image,
.post-image {
    background: linear-gradient(135deg, #dce7fa, #afc5ee) center/cover;
}

.feature-copy {
    padding: clamp(24px, 5vw, 52px);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
}

.tag {
    font-size: 11px;
    font-weight: 800;
    color: var(--blue);
    letter-spacing: 1.3px;
    text-transform: uppercase;
}

.feature-copy h3 {
    font-size: clamp(26px, 3vw, 38px);
    line-height: 1.15;
    letter-spacing: -1px;
    margin: 14px 0;
}

.feature-copy p,
.post-copy p {
    color: var(--muted);
    line-height: 1.7;
    margin: 0 0 18px;
}

.meta {
    font-size: 12px;
    color: var(--muted);
    font-weight: 600;
}

.read {
    color: var(--blue);
    font-weight: 800;
    font-size: 13px;
    margin-top: 18px;
}

/* ARTICLE GRID */

.grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 26px;
}

.post {
    border: 1px solid var(--border);
    text-decoration: none;
    color: inherit;
    transition: .2s;
    min-width: 0;
}

.post:hover {
    transform: translateY(-4px);
    box-shadow: 0 16px 38px #202b4c12;
}

.post-image {
    aspect-ratio: 16/10;
}

.post-copy {
    padding: 22px;
}

.post-copy h3 {
    font-size: 20px;
    line-height: 1.3;
    margin: 10px 0;
}

.post-copy p {
    font-size: 14px;
}

.empty {
    padding: 40px 20px;
    border: 1px solid var(--border);
    color: var(--muted);
    text-align: center;
    grid-column: 1/-1;
}

/* INDIVIDUAL ARTICLES */

.article {
    max-width: 850px;
    margin: auto;
}

.back {
    display: inline-block;
    color: var(--blue);
    font-size: 13px;
    font-weight: 800;
    text-decoration: none;
    margin-bottom: 30px;
}

.article h1 {
    font-size: clamp(36px, 5vw, 58px);
    letter-spacing: -2px;
    line-height: 1.1;
    margin: 14px 0;
}

.excerpt {
    font-size: 19px;
    line-height: 1.7;
    color: var(--muted);
}

.cover {
    width: 100%;
    aspect-ratio: 16/9;
    object-fit: cover;
    margin: 28px 0;
}

.bodycopy {
    font-size: 16px;
    line-height: 1.9;
    color: #34405b;
    overflow-wrap: anywhere;
}

.bodycopy h2,
.bodycopy h3 {
    margin: 34px 0 12px;
    color: var(--navy);
}

.bodycopy img {
    max-width: 100%;
    height: auto;
}

.bodycopy a {
    color: var(--blue);
}

.bodycopy blockquote {
    border-left: 3px solid var(--blue);
    padding-left: 18px;
    color: var(--muted);
}

/* RESPONSIVE */

@media(max-width:850px) {
    .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }
}

@media(max-width:620px) {
    .hero {
        padding: 70px 0;
    }

    .inner {
        width: calc(100% - 34px);
    }

    main {
        padding: 42px 0 70px;
    }

    .featured {
        grid-template-columns: 1fr;
    }

    .feature-image {
        min-height: 210px;
    }

    .grid {
        grid-template-columns: 1fr;
    }

    .search {
        width: 100%;
    }

    .hero h1 {
        letter-spacing: -1.8px;
    }
}
</style>
</head>

<body>

<!-- =====================================================
     SHARED HAWTHORNE DIGITAL HEADER
     Loaded from /shared/header.html
====================================================== -->

<div id="sharedHeader"></div>


<!-- =====================================================
     BLOG HERO
====================================================== -->

<section class="hero" id="hero">
    <div class="inner">

        <div class="eyebrow">
            The Hawthorne Digital Journal
        </div>

        <h1>
            Ideas for a more connected digital world.
        </h1>

        <p>
            Practical advice, fresh perspectives and useful insights
            to help businesses make more of their digital presence.
        </p>

    </div>
</section>


<!-- =====================================================
     BLOG CONTENT
====================================================== -->

<main class="inner">

    <div class="toolbar">
        <h2 id="heading">Latest insights</h2>

        <input
            id="search"
            class="search"
            type="search"
            placeholder="Search articles..."
            aria-label="Search articles"
        >
    </div>

    <div id="categories" class="categories"></div>

    <div id="featuredArea" hidden>
        <div class="featured-label">EDITOR'S PICK</div>
        <div id="featured"></div>
    </div>

    <div id="grid" class="grid">
        <div class="empty">Loading articles...</div>
    </div>

    <article id="article" class="article" hidden></article>

</main>


<!-- =====================================================
     SHARED HAWTHORNE DIGITAL FOOTER
     Loaded from /shared/footer.html
====================================================== -->

<div id="sharedFooter"></div>


<!-- =====================================================
     BLOG FUNCTIONALITY
====================================================== -->

<script>
(() => {

    "use strict";

    /* SUPABASE CONFIGURATION */

    const SUPABASE_URL = "ADD_SUPABASE_PROJECT_URL";
    const SUPABASE_ANON_KEY = "ADD_SUPABASE_ANON_KEY";

    const client = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );

    const $ = id => document.getElementById(id);

    let posts = [];
    let category = "All";

    /* HELPERS */

    const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    }[c]));

    const date = s => s
        ? new Intl.DateTimeFormat("en-GB", {
            day: "numeric",
            month: "long",
            year: "numeric"
        }).format(new Date(s))
        : "";

    const url = p => "/blog?post=" + encodeURIComponent(p.slug);

    /* ARTICLE CARDS */

    function card(p, large = false) {

        const image = p.cover_image
            ? `style="background-image:url('${esc(p.cover_image)}')"`
            : "";

        if (large) {

            return `
                <a class="featured" href="${url(p)}">

                    <div class="feature-image" ${image}></div>

                    <div class="feature-copy">

                        <span class="tag">${esc(p.category)}</span>

                        <h3>${esc(p.title)}</h3>

                        <p>${esc(p.excerpt)}</p>

                        <span class="meta">
                            ${date(p.published_at)}
                        </span>

                        <span class="read">
                            Read article →
                        </span>

                    </div>

                </a>
            `;
        }

        return `
            <a class="post" href="${url(p)}">

                <div class="post-image" ${image}></div>

                <div class="post-copy">

                    <span class="tag">
                        ${esc(p.category)}
                    </span>

                    <h3>${esc(p.title)}</h3>

                    <p>${esc(p.excerpt)}</p>

                    <span class="meta">
                        ${date(p.published_at)}
                    </span>

                </div>

            </a>
        `;
    }

    /* CATEGORY FILTERS */

    function renderCats() {

        const cats = [
            "All",
            ...new Set(posts.map(p => p.category).filter(Boolean))
        ];

        $("categories").innerHTML = cats.map(c => `
            <button
                class="cat ${c === category ? "active" : ""}"
                data-cat="${esc(c)}"
                type="button"
            >
                ${esc(c)}
            </button>
        `).join("");

        $("categories")
            .querySelectorAll("button")
            .forEach(b => {

                b.onclick = () => {
                    category = b.dataset.cat;
                    renderCats();
                    renderPosts();
                };

            });
    }

    /* DISPLAY ARTICLES */

    function renderPosts() {

        const term = $("search").value.toLowerCase().trim();

        const found = posts.filter(p => {

            const matchesCategory =
                category === "All" || p.category === category;

            const matchesSearch =
                `${p.title} ${p.excerpt} ${p.category}`
                    .toLowerCase()
                    .includes(term);

            return matchesCategory && matchesSearch;
        });

        const feature = found.find(p => p.featured);

        const rest = found.filter(p =>
            !feature || p.id !== feature.id
        );

        $("featuredArea").hidden = !feature;

        $("featured").innerHTML = feature
            ? card(feature, true)
            : "";

        $("grid").innerHTML = rest.length
            ? rest.map(p => card(p)).join("")
            : (!feature
                ? `<div class="empty">
                    No articles match your search.
                    Try another keyword or category.
                   </div>`
                : "");
    }

    /* INDIVIDUAL ARTICLE VIEW */

    function showArticle(p) {

        $("hero").hidden = true;
        $("heading").hidden = true;
        $("search").hidden = true;
        $("categories").hidden = true;
        $("featuredArea").hidden = true;
        $("grid").hidden = true;
        $("article").hidden = false;

        document.title = p.title + " | Hawthorne Digital";

        const html = marked.parse(p.content || "");

        $("article").innerHTML = `

            <a class="back" href="/blog">
                ← Back to all articles
            </a>

            <div class="tag">
                ${esc(p.category)}
            </div>

            <h1>${esc(p.title)}</h1>

            <div class="meta">
                ${date(p.published_at)}
            </div>

            ${p.excerpt
                ? `<p class="excerpt">${esc(p.excerpt)}</p>`
                : ""
            }

            ${p.cover_image
                ? `<img class="cover" src="${esc(p.cover_image)}" alt="">`
                : ""
            }

            <div class="bodycopy">
                ${DOMPurify.sanitize(html)}
            </div>

        `;

        window.scrollTo(0, 0);
    }

    /* LOAD BLOG POSTS */

    async function init() {

        try {

            const { data, error } = await client
                .from("blog_posts")
                .select(`
                    id,
                    title,
                    slug,
                    excerpt,
                    content,
                    category,
                    cover_image,
                    published_at,
                    featured
                `)
                .eq("status", "published")
                .lte("published_at", new Date().toISOString())
                .order("featured", { ascending: false })
                .order("published_at", { ascending: false });

            if (error) throw error;

            posts = data || [];

            const slug = new URLSearchParams(location.search)
                .get("post");

            if (slug) {

                const p = posts.find(x => x.slug === slug);

                if (p) {
                    showArticle(p);
                    return;
                }

                $("grid").innerHTML = `
                    <div class="empty">
                        This article could not be found.
                    </div>
                `;

                return;
            }

            renderCats();
            renderPosts();

            if (!posts.length) {

                $("grid").innerHTML = `
                    <div class="empty">
                        Our articles are on their way.
                        Please check back soon.
                    </div>
                `;
            }

        } catch (e) {

            console.error("Blog loading error:", e);

            $("grid").innerHTML = `
                <div class="empty">
                    We are having trouble loading the blog.
                    Please try again shortly.
                </div>
            `;
        }
    }

    /* SEARCH */

    $("search").addEventListener("input", renderPosts);

    /* START */

    init();

})();
</script>

</body>
</html>
